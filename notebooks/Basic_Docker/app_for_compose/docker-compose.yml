version: "3"
services:

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

volumes:
  redis-data:





