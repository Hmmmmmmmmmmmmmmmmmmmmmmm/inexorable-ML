<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pretty Random Cats</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;

background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb,#a6c1ee);
background-size:300% 300%;
animation:bgMove 16s ease infinite;
}

@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.container{

width:100%;
max-width:900px;

background:rgba(255,255,255,0.9);
backdrop-filter:blur(10px);

border-radius:24px;

padding:clamp(18px,4vw,40px);

box-shadow:0 20px 50px rgba(0,0,0,.2);

text-align:center;

display:flex;
flex-direction:column;
gap:clamp(15px,2vw,25px);

}

h1{
font-size:clamp(1.6rem,3vw,2.5rem);
}

.cat-box{

position:relative;

width:100%;

aspect-ratio:4/3;

border-radius:18px;

overflow:hidden;

background:#eee;

display:flex;
align-items:center;
justify-content:center;

}

.cat-box img{

width:100%;
height:100%;

object-fit:cover;

transition:opacity .4s ease, transform .4s ease;

}

img.loading{
opacity:.3;
transform:scale(.97);
}

.loader{

position:absolute;

font-size:clamp(.9rem,2vw,1.1rem);

opacity:.7;

}

button{

align-self:center;

padding:clamp(12px,1.8vw,16px) clamp(22px,3vw,32px);

font-size:clamp(.95rem,1.4vw,1.1rem);

border:none;

border-radius:999px;

background:linear-gradient(135deg,#ff758c,#ff7eb3);

color:white;

cursor:pointer;

transition:.2s;

}

button:hover{

transform:translateY(-3px);

box-shadow:0 10px 25px rgba(0,0,0,.2);

}

button:active{

transform:scale(.96);

}

.footer{

font-size:clamp(.75rem,1vw,.9rem);

opacity:.6;

}

</style>
</head>

<body>

<div class="container">

<h1>🐾 Random Pretty Cats</h1>

<div class="cat-box">
<div class="loader" id="loader">Loading cat...</div>
<img id="catImage">
</div>

<button onclick="newCat()">Show Another Cat 🐱</button>

<div class="footer">
Powered by TheCatAPI
</div>

</div>

<script>

const img = document.getElementById("catImage");
const loader = document.getElementById("loader");

async function newCat(){

loader.style.display="block";
img.classList.add("loading");

try{

const res = await fetch("https://api.thecatapi.com/v1/images/search");
const data = await res.json();

img.onload=()=>{
loader.style.display="none";
img.classList.remove("loading");
};

img.src=data[0].url;

}catch{

loader.textContent="Failed to load cat 😿";

}

}

newCat();

</script>

</body>
</html>
